name: Actualizar dashboard desde Trello

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: trello-dashboard-sync
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar datos públicos de Trello
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        run: python3 scripts/sync_trello.py

      - name: Guardar actualización
        run: |
          if git diff --quiet -- data/trello.json; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trello.json
          git commit -m "Actualizar datos públicos de Trello"
          git push
